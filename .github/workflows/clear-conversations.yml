name: Clear conversation data

# 只允许手动触发，不会在每次 push/部署时自动清空数据。
# 在 GitHub → Actions → "Clear conversation data" → Run workflow。
on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Clear conversations over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: false
          script: |
            set -e
            # 容器由部署工作流以 docker run 启动（名字 cs-demo-chatbot），直接 exec 即可
            docker exec cs-demo-chatbot python scripts/clear_conversations.py --yes
            echo "Conversation data cleared."
