name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            # 脱敏版与正式版同机部署：目录 ~/cs，对外端口见 .env 的 APP_PORT（默认 8001）
            mkdir -p ~/cs
            cd ~/cs
            if [ ! -d .git ]; then
              git clone https://github.com/yunitechhk2025/cs.git .
            else
              git remote set-url origin https://github.com/yunitechhk2025/cs.git
              git fetch origin main
              git reset --hard origin/main
            fi
            if [ ! -f .env ]; then
              echo "ERROR: ~/cs/.env 不存在。请先在服务器上复制 .env.example 为 .env 并填好 OPENAI_API_KEY 等配置。" >&2
              exit 1
            fi
            mkdir -p data
            docker compose up -d --build
            docker compose ps
