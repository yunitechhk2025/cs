name: Deploy to Aliyun ECS

# 脱敏演示版自动部署：
#   步骤1 用仓库 Secrets 在服务器写入 ~/cs/.env
#   步骤2 拉取最新代码、重建容器、健康检查（失败时自动输出容器日志）
# 密钥只在 GitHub 端替换进脚本文本，不经过 SSH envs / base64 / scp。

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Write .env on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            echo "==> write ~/cs/.env"
            mkdir -p ~/cs/data
            cd ~/cs

            OLD_JWT=""
            OLD_ADMIN_PW=""
            if [ -f .env ]; then
              OLD_JWT=$(grep -E '^JWT_SECRET=' .env | head -n1 | cut -d= -f2- || true)
              OLD_ADMIN_PW=$(grep -E '^ADMIN_PASSWORD=' .env | head -n1 | cut -d= -f2- || true)
            fi

            cat > .env <<'EOF'
            OPENAI_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
            OPENAI_MODEL=qwen3.6-flash
            OPENAI_BASE_URL=https://dashscope-intl.aliyuncs.com/compatible-mode/v1

            FAQ_TOP_K=8
            FAQ_MIN_SCORE=0.05
            FAQ_EMBED_MODEL=text-embedding-v3
            APP_PORT=8001

            JWT_SECRET=__KEEP__
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=__KEEP__
            DEFAULT_MODE=auto

            SMTP_HOST=
            SMTP_PORT=587
            SMTP_USERNAME=
            SMTP_PASSWORD=
            SMTP_FROM=
            SMTP_USE_TLS=true
            SMTP_USE_SSL=false
            NOTIFY_EMAIL_TO=
            EOF
            sed -i 's/^[[:space:]]*//' .env
            chmod 600 .env

            if [ -z "$(grep -E '^OPENAI_API_KEY=' .env | cut -d= -f2-)" ]; then
              echo "ERROR: 仓库 Secret DASHSCOPE_API_KEY 为空或未配置" >&2
              exit 1
            fi

            if [ -n "$OLD_JWT" ] && [ "$OLD_JWT" != "__KEEP__" ]; then
              sed -i "s|^JWT_SECRET=__KEEP__$|JWT_SECRET=${OLD_JWT}|" .env
            else
              NEW_JWT=$(cat /proc/sys/kernel/random/uuid | tr -d '-')
              sed -i "s|^JWT_SECRET=__KEEP__$|JWT_SECRET=${NEW_JWT}|" .env
            fi

            if [ -n "$OLD_ADMIN_PW" ] && [ "$OLD_ADMIN_PW" != "__KEEP__" ]; then
              sed -i "s|^ADMIN_PASSWORD=__KEEP__$|ADMIN_PASSWORD=${OLD_ADMIN_PW}|" .env
            else
              sed -i "s|^ADMIN_PASSWORD=__KEEP__$|ADMIN_PASSWORD=changeme|" .env
              echo "WARN: 管理员密码为默认 changeme，请登录后修改"
            fi

            echo "==> .env ready (APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2-))"

      - name: Update code and restart container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "==> [1/5] check ~/cs"
            mkdir -p ~/cs/data
            cd ~/cs
            test -f .env || { echo "ERROR: .env missing" >&2; exit 1; }

            echo "==> [2/5] fetch latest code"
            rm -rf /tmp/cs-src
            git clone --depth 1 --branch main https://github.com/yunitechhk2025/cs.git /tmp/cs-src
            cp -a /tmp/cs-src/. ~/cs/
            rm -rf /tmp/cs-src
            git -C ~/cs log -1 --oneline || true

            echo "==> [3/5] docker compose up"
            docker --version
            wc -c .env
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "ERROR: docker compose / docker-compose not found" >&2
              exit 1
            fi
            # 先彻底移除旧容器：历史部署尝试留下的容器对象可能已损坏，
            # 直接 Recreate 会触发 ResourceExhausted (gRPC message too large)。
            $DC down --remove-orphans || true
            docker rm -f cs-demo-chatbot 2>/dev/null || true
            if ! $DC up -d --build; then
              echo "WARN: start failed, restarting docker daemon and retrying once"
              systemctl restart docker || service docker restart
              sleep 10
              $DC up -d --build
            fi

            echo "==> [4/5] container status"
            sleep 8
            $DC ps

            echo "==> [5/5] health check"
            PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2-)
            PORT=${PORT:-8001}
            if command -v curl >/dev/null 2>&1; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://127.0.0.1:${PORT}/" || echo 000)
              echo "HTTP ${CODE} on 127.0.0.1:${PORT}"
              if [ "$CODE" != "200" ]; then
                echo "==== container logs (last 100 lines) ===="
                $DC logs --tail=100
                exit 1
              fi
            else
              echo "WARN: curl not installed, skip health check"
            fi
            echo "==> deploy done, service healthy"
