name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # 兼容 OPENAI_API_KEY 或 DASHSCOPE_API_KEY（二选一即可）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          FAQ_TOP_K: ${{ secrets.FAQ_TOP_K }}
          FAQ_MIN_SCORE: ${{ secrets.FAQ_MIN_SCORE }}
          FAQ_EMBED_MODEL: ${{ secrets.FAQ_EMBED_MODEL }}
          APP_PORT: ${{ secrets.APP_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DEFAULT_MODE: ${{ secrets.DEFAULT_MODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          # 把上面 env 传进远程 SSH 会话，供生成 .env 使用
          envs: OPENAI_API_KEY,DASHSCOPE_API_KEY,OPENAI_MODEL,OPENAI_BASE_URL,FAQ_TOP_K,FAQ_MIN_SCORE,FAQ_EMBED_MODEL,APP_PORT,JWT_SECRET,ADMIN_USERNAME,ADMIN_PASSWORD,DEFAULT_MODE,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM,SMTP_USE_TLS,SMTP_USE_SSL,NOTIFY_EMAIL_TO
          script: |
            set -e
            # 脱敏版与正式版同机部署：目录 ~/cs，对外端口见 .env 的 APP_PORT（默认 8001）
            mkdir -p ~/cs
            cd ~/cs
            if [ ! -d .git ]; then
              git clone https://github.com/yunitechhk2025/cs.git .
            else
              git remote set-url origin https://github.com/yunitechhk2025/cs.git
              git fetch origin main
              git reset --hard origin/main
            fi

            # 用 GitHub Secrets 在服务器上生成 .env（不进 git）
            python3 <<'PY'
            import os
            import secrets as pysecrets
            from pathlib import Path

            def opt(name: str, default: str = "") -> str:
                value = (os.environ.get(name) or "").strip()
                return value if value else default

            def read_existing_env(path: Path) -> dict:
                data = {}
                if not path.is_file():
                    return data
                for line in path.read_text(encoding="utf-8").splitlines():
                    line = line.strip()
                    if not line or line.startswith("#") or "=" not in line:
                        continue
                    key, _, value = line.partition("=")
                    data[key.strip()] = value.strip()
                return data

            existing = read_existing_env(Path(".env"))

            api_key = opt("OPENAI_API_KEY") or opt("DASHSCOPE_API_KEY")
            if not api_key:
                raise SystemExit(
                    "ERROR: 缺少 API Key。请在 Repository secrets 中配置 "
                    "DASHSCOPE_API_KEY 或 OPENAI_API_KEY。"
                )

            jwt_secret = opt("JWT_SECRET") or existing.get("JWT_SECRET") or pysecrets.token_hex(32)
            admin_password = (
                opt("ADMIN_PASSWORD")
                or existing.get("ADMIN_PASSWORD")
                or "changeme"
            )
            if not opt("ADMIN_PASSWORD") and not existing.get("ADMIN_PASSWORD"):
                print("WARN: 未配置 ADMIN_PASSWORD，脱敏版默认使用 admin / changeme，请登录后立刻修改。")

            lines = [
                f"OPENAI_API_KEY={api_key}",
                f"OPENAI_MODEL={opt('OPENAI_MODEL', 'qwen3.6-flash')}",
                f"OPENAI_BASE_URL={opt('OPENAI_BASE_URL', 'https://dashscope-intl.aliyuncs.com/compatible-mode/v1')}",
                "",
                f"FAQ_TOP_K={opt('FAQ_TOP_K', '8')}",
                f"FAQ_MIN_SCORE={opt('FAQ_MIN_SCORE', '0.05')}",
                f"FAQ_EMBED_MODEL={opt('FAQ_EMBED_MODEL', 'text-embedding-v3')}",
                f"APP_PORT={opt('APP_PORT', '8001')}",
                "",
                f"JWT_SECRET={jwt_secret}",
                f"ADMIN_USERNAME={opt('ADMIN_USERNAME', 'admin')}",
                f"ADMIN_PASSWORD={admin_password}",
                f"DEFAULT_MODE={opt('DEFAULT_MODE', 'auto')}",
                "",
                f"SMTP_HOST={opt('SMTP_HOST')}",
                f"SMTP_PORT={opt('SMTP_PORT', '587')}",
                f"SMTP_USERNAME={opt('SMTP_USERNAME')}",
                f"SMTP_PASSWORD={opt('SMTP_PASSWORD')}",
                f"SMTP_FROM={opt('SMTP_FROM')}",
                f"SMTP_USE_TLS={opt('SMTP_USE_TLS', 'true')}",
                f"SMTP_USE_SSL={opt('SMTP_USE_SSL', 'false')}",
                f"NOTIFY_EMAIL_TO={opt('NOTIFY_EMAIL_TO')}",
                "",
            ]
            path = Path(".env")
            path.write_text("\n".join(lines), encoding="utf-8")
            path.chmod(0o600)
            print("Wrote ~/cs/.env from GitHub Secrets")
            PY

            mkdir -p data
            docker compose up -d --build
            docker compose ps
