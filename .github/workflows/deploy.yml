name: Deploy to Aliyun ECS

# 脱敏演示版自动部署：
#   步骤1 用仓库 Secrets 在服务器写入 ~/cs/.env
#   步骤2 拉最新代码、docker build、docker run 启动、健康检查（失败自动打印容器日志）
#
# WHATSAPP_* 四个 Secret 没配时会写成空值，WhatsApp 接入自动处于关闭状态，不影响网页端。
#
# 两个经验教训（勿改回去）：
#   - script_stop 必须为 false：它会往脚本每行间注入检查语句，把 heredoc 写出的 .env 污染掉
#   - 启动用 docker run 而不是 docker compose：服务器上老版 compose 插件(v2.29.7)配新版
#     Docker(29.x) 启动容器会报 ResourceExhausted (gRPC message too large)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Write .env on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: false
          command_timeout: 10m
          script: |
            set -e
            echo "==> write ~/cs/.env"
            mkdir -p ~/cs/data
            cd ~/cs

            OLD_JWT=""
            OLD_ADMIN_PW=""
            if [ -f .env ]; then
              OLD_JWT=$(grep -E '^JWT_SECRET=' .env | head -n1 | cut -d= -f2- || true)
              OLD_ADMIN_PW=$(grep -E '^ADMIN_PASSWORD=' .env | head -n1 | cut -d= -f2- || true)
            fi

            cat > .env <<'EOF'
            OPENAI_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
            OPENAI_MODEL=qwen3.6-flash
            OPENAI_BASE_URL=https://dashscope-intl.aliyuncs.com/compatible-mode/v1

            FAQ_TOP_K=8
            FAQ_MIN_SCORE=0.05
            FAQ_EMBED_MODEL=text-embedding-v3
            APP_PORT=8001

            JWT_SECRET=__KEEP__
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=__KEEP__
            DEFAULT_MODE=auto

            WHATSAPP_ACCESS_TOKEN=${{ secrets.WHATSAPP_ACCESS_TOKEN }}
            WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
            WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}
            WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET }}
            WHATSAPP_API_VERSION=v21.0

            SMTP_HOST=
            SMTP_PORT=587
            SMTP_USERNAME=
            SMTP_PASSWORD=
            SMTP_FROM=
            SMTP_USE_TLS=true
            SMTP_USE_SSL=false
            NOTIFY_EMAIL_TO=
            EOF
            sed -i 's/^[[:space:]]*//' .env
            chmod 600 .env

            if [ -z "$(grep -E '^OPENAI_API_KEY=' .env | cut -d= -f2-)" ]; then
              echo "ERROR: 仓库 Secret DASHSCOPE_API_KEY 为空或未配置" >&2
              exit 1
            fi

            if [ -n "$OLD_JWT" ] && [ "$OLD_JWT" != "__KEEP__" ]; then
              sed -i "s|^JWT_SECRET=__KEEP__$|JWT_SECRET=${OLD_JWT}|" .env
            else
              NEW_JWT=$(cat /proc/sys/kernel/random/uuid | tr -d '-')
              sed -i "s|^JWT_SECRET=__KEEP__$|JWT_SECRET=${NEW_JWT}|" .env
            fi

            if [ -n "$OLD_ADMIN_PW" ] && [ "$OLD_ADMIN_PW" != "__KEEP__" ]; then
              sed -i "s|^ADMIN_PASSWORD=__KEEP__$|ADMIN_PASSWORD=${OLD_ADMIN_PW}|" .env
            else
              sed -i "s|^ADMIN_PASSWORD=__KEEP__$|ADMIN_PASSWORD=changeme|" .env
              echo "WARN: 管理员密码为默认 changeme，请登录后修改"
            fi

            echo "==> .env ready ($(wc -c < .env) bytes, APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2-))"

      - name: Update code and restart container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: false
          command_timeout: 30m
          script: |
            set -e
            echo "==> [1/5] check ~/cs"
            mkdir -p ~/cs/data
            cd ~/cs
            test -f .env || { echo "ERROR: .env missing" >&2; exit 1; }

            echo "==> [2/5] fetch latest code"
            rm -rf /tmp/cs-src
            # 这台 ECS 连 github.com 偶发超时（默认要卡两分多钟才报错）。用 lowSpeed 参数让
            # 单次尝试 30 秒内没速度就失败，再重试三次，避免一次网络抖动就让整个部署挂掉。
            for i in 1 2 3; do
              if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 \
                   clone --depth 1 --branch main \
                   https://github.com/yunitechhk2025/cs.git /tmp/cs-src; then
                break
              fi
              echo "==> clone 第 ${i} 次失败，等 15 秒后重试"
              rm -rf /tmp/cs-src
              sleep 15
            done
            test -d /tmp/cs-src || { echo "ERROR: 连续三次无法从 GitHub 拉取代码" >&2; exit 1; }
            cp -a /tmp/cs-src/. ~/cs/
            rm -rf /tmp/cs-src
            git -C ~/cs log -1 --oneline || true

            echo "==> [3/5] docker build"
            docker build -t cs-faq-chatbot ~/cs

            echo "==> [4/5] restart container (docker run, not compose)"
            docker rm -f cs-demo-chatbot 2>/dev/null || true
            PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2-)
            PORT=${PORT:-8001}
            docker run -d --name cs-demo-chatbot --restart unless-stopped \
              --env-file ~/cs/.env \
              -e FAQ_EXCEL_PATH=/data/faq.xls -e DB_DIR=/app/data \
              -v "$HOME/cs/2026.01.26_肤润康-常见咨询问题_v2(1).xls:/data/faq.xls:ro" \
              -v "$HOME/cs/data:/app/data" \
              -p ${PORT}:8000 cs-faq-chatbot
            sleep 8
            docker ps --filter name=cs-demo-chatbot

            echo "==> [5/5] health check"
            if command -v curl >/dev/null 2>&1; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://127.0.0.1:${PORT}/" || echo 000)
              echo "HTTP ${CODE} on 127.0.0.1:${PORT}"
              if [ "$CODE" != "200" ]; then
                echo "==== container logs (last 100 lines) ===="
                docker logs --tail=100 cs-demo-chatbot || true
                exit 1
              fi
            else
              echo "WARN: curl not installed, skip health check"
            fi

            # 默认工作模式设为全 AI（auto）。库里已有 global_mode 时仅改 .env 不会生效，
            # 这里在每次部署后显式写入，保证上线就是全 AI；之后仍可在工作台临时切换。
            echo "==> set global_mode=auto (全AI)"
            docker exec cs-demo-chatbot python -c "import database; database.set_setting('global_mode', 'auto'); print(database.get_setting('global_mode'))"

            echo "==> deploy done, service healthy"
