name: Deploy to Aliyun ECS

# 脱敏版部署策略（稳定版）：
# 1) 用「Bootstrap server .env」工作流（手动）在服务器写入一次 ~/cs/.env
# 2) 本工作流只负责：拉代码 + docker compose 重建
# 不再通过 SSH envs / base64 / scp 传密钥，避免传参被截断或转义失败。

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bootstrap_env:
    runs-on: ubuntu-latest
    steps:
      - name: Create server .env from repository secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "==> write ~/cs/.env"
            mkdir -p ~/cs/data
            cd ~/cs
            cat > .env <<'EOF'
            OPENAI_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
            OPENAI_MODEL=qwen3.6-flash
            OPENAI_BASE_URL=https://dashscope-intl.aliyuncs.com/compatible-mode/v1

            FAQ_TOP_K=8
            FAQ_MIN_SCORE=0.05
            FAQ_EMBED_MODEL=text-embedding-v3
            APP_PORT=8001

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            DEFAULT_MODE=auto
            EOF
            sed -i 's/^[[:space:]]*//' .env

            if [ -z "$(grep -E '^OPENAI_API_KEY=' .env | cut -d= -f2-)" ]; then
              echo "ERROR: Repository secret DASHSCOPE_API_KEY is empty or missing." >&2
              exit 1
            fi

            # 可选的 JWT / 管理员密码未配置时，为脱敏演示版提供安全可运行的默认值。
            if [ -z "$(grep -E '^JWT_SECRET=' .env | cut -d= -f2-)" ]; then
              sed -i "s|^JWT_SECRET=$|JWT_SECRET=$(cat /proc/sys/kernel/random/uuid | tr -d '-')|" .env
              echo "==> generated JWT_SECRET"
            fi
            if [ -z "$(grep -E '^ADMIN_PASSWORD=' .env | cut -d= -f2-)" ]; then
              sed -i 's|^ADMIN_PASSWORD=$|ADMIN_PASSWORD=changeme|' .env
              echo "WARN: using default administrator password; change it after login."
            fi
            chmod 600 .env
            echo "==> .env ready"

  deploy:
    needs: bootstrap_env
    runs-on: ubuntu-latest
    steps:
      - name: Deploy code over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "==> prepare ~/cs"
            mkdir -p ~/cs/data
            cd ~/cs
            pwd

            if [ ! -f .env ]; then
              echo "ERROR: ~/cs/.env 不存在。" >&2
              echo "请先到 Actions 手动运行一次「Bootstrap server .env」，或 SSH 自行创建 .env。" >&2
              exit 1
            fi
            echo "==> .env exists (APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2- || echo '?'))"

            echo "==> update code"
            if [ ! -d .git ]; then
              TMPDIR=$(mktemp -d)
              git clone https://github.com/yunitechhk2025/cs.git "$TMPDIR/repo"
              find "$TMPDIR/repo" -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -a {} ~/cs/ \;
              cp -a "$TMPDIR/repo/.git" ~/cs/
              rm -rf "$TMPDIR"
            else
              git remote set-url origin https://github.com/yunitechhk2025/cs.git
              git fetch origin main
              git reset --hard origin/main
            fi
            git log -1 --oneline

            # 确保 .env 仍在（被 ignore，reset 不会删）
            if [ ! -f .env ]; then
              echo "ERROR: .env missing after code update" >&2
              exit 1
            fi
            mkdir -p data

            echo "==> docker compose up"
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
              docker compose ps
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build
              docker-compose ps
            else
              echo "ERROR: docker compose / docker-compose not found" >&2
              exit 1
            fi

            echo "==> deploy done"
