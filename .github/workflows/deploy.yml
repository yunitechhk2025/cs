name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare .env on runner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          FAQ_TOP_K: ${{ secrets.FAQ_TOP_K }}
          FAQ_MIN_SCORE: ${{ secrets.FAQ_MIN_SCORE }}
          FAQ_EMBED_MODEL: ${{ secrets.FAQ_EMBED_MODEL }}
          APP_PORT: ${{ secrets.APP_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DEFAULT_MODE: ${{ secrets.DEFAULT_MODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          set -e
          API_KEY="${OPENAI_API_KEY:-}"
          if [ -z "$API_KEY" ]; then
            API_KEY="${DASHSCOPE_API_KEY:-}"
          fi
          if [ -z "$API_KEY" ]; then
            echo "ERROR: 缺少 API Key。请配置 Repository secret：DASHSCOPE_API_KEY 或 OPENAI_API_KEY"
            exit 1
          fi

          # 未在 Secrets 配置时写占位符，由服务器沿用旧值或首次生成
          JWT_VAL="${JWT_SECRET:-__PRESERVE_OR_GENERATE__}"
          ADMIN_PW_VAL="${ADMIN_PASSWORD:-__PRESERVE_OR_DEFAULT__}"

          umask 077
          cat > "$GITHUB_WORKSPACE/cs.env" <<EOF
          OPENAI_API_KEY=${API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL:-qwen3.6-flash}
          OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}

          FAQ_TOP_K=${FAQ_TOP_K:-8}
          FAQ_MIN_SCORE=${FAQ_MIN_SCORE:-0.05}
          FAQ_EMBED_MODEL=${FAQ_EMBED_MODEL:-text-embedding-v3}
          APP_PORT=${APP_PORT:-8001}

          JWT_SECRET=${JWT_VAL}
          ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
          ADMIN_PASSWORD=${ADMIN_PW_VAL}
          DEFAULT_MODE=${DEFAULT_MODE:-auto}

          SMTP_HOST=${SMTP_HOST:-}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USERNAME=${SMTP_USERNAME:-}
          SMTP_PASSWORD=${SMTP_PASSWORD:-}
          SMTP_FROM=${SMTP_FROM:-}
          SMTP_USE_TLS=${SMTP_USE_TLS:-true}
          SMTP_USE_SSL=${SMTP_USE_SSL:-false}
          NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
          EOF
          sed -i 's/^[[:space:]]*//' "$GITHUB_WORKSPACE/cs.env"
          # scp-action 跑在 Docker 里，需要能读到工作区文件；勿用 600
          chmod 644 "$GITHUB_WORKSPACE/cs.env"
          echo "Prepared cs.env for upload"

      - name: Ensure remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "==> prepare ~/cs"
            mkdir -p ~/cs/data

      - name: Upload .env
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          source: "cs.env"
          target: "~/cs/"
          overwrite: true

      - name: Deploy code and restart container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "==> enter ~/cs"
            cd ~/cs
            pwd

            if [ ! -f cs.env ]; then
              echo "ERROR: cs.env was not uploaded" >&2
              exit 1
            fi

            OLD_JWT=""
            OLD_ADMIN_PW=""
            if [ -f .env ]; then
              OLD_JWT=$(grep -E '^JWT_SECRET=' .env | head -n1 | cut -d= -f2- || true)
              OLD_ADMIN_PW=$(grep -E '^ADMIN_PASSWORD=' .env | head -n1 | cut -d= -f2- || true)
            fi

            mv -f cs.env .env
            chmod 600 .env

            if grep -q '^JWT_SECRET=__PRESERVE_OR_GENERATE__$' .env; then
              if [ -n "$OLD_JWT" ]; then
                sed -i "s|^JWT_SECRET=__PRESERVE_OR_GENERATE__$|JWT_SECRET=${OLD_JWT}|" .env
              else
                NEW_JWT=$(cat /proc/sys/kernel/random/uuid | tr -d '-')
                sed -i "s|^JWT_SECRET=__PRESERVE_OR_GENERATE__$|JWT_SECRET=${NEW_JWT}|" .env
                echo "==> generated new JWT_SECRET"
              fi
            fi

            if grep -q '^ADMIN_PASSWORD=__PRESERVE_OR_DEFAULT__$' .env; then
              if [ -n "$OLD_ADMIN_PW" ] && [ "$OLD_ADMIN_PW" != "__PRESERVE_OR_DEFAULT__" ]; then
                sed -i "s|^ADMIN_PASSWORD=__PRESERVE_OR_DEFAULT__$|ADMIN_PASSWORD=${OLD_ADMIN_PW}|" .env
              else
                sed -i "s|^ADMIN_PASSWORD=__PRESERVE_OR_DEFAULT__$|ADMIN_PASSWORD=changeme|" .env
                echo "WARN: using default admin/changeme"
              fi
            fi

            echo "==> .env ready (APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2-))"

            echo "==> update code"
            if [ ! -d .git ]; then
              TMPDIR=$(mktemp -d)
              git clone https://github.com/yunitechhk2025/cs.git "$TMPDIR/repo"
              # 同步代码，保留 .env 与 data
              find "$TMPDIR/repo" -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -a {} ~/cs/ \;
              cp -a "$TMPDIR/repo/.git" ~/cs/
              rm -rf "$TMPDIR"
            else
              git remote set-url origin https://github.com/yunitechhk2025/cs.git
              git fetch origin main
              git reset --hard origin/main
            fi
            git log -1 --oneline

            if [ ! -f .env ]; then
              echo "ERROR: .env missing after code update" >&2
              exit 1
            fi
            mkdir -p data

            echo "==> docker compose up"
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
              docker compose ps
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build
              docker-compose ps
            else
              echo "ERROR: docker compose / docker-compose not found" >&2
              exit 1
            fi

            echo "==> deploy done"
